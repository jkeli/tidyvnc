name: Native macOS viewer

# Also called by release.yml, so a release is only signed after these jobs
# pass on the tagged commit.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest hosted Apple silicon image. The app's floor is macOS 13,
          # which has no hosted runner; it is checked in a local VM. macOS 14
          # images retire 2026-11-02; move this job to the oldest remaining one.
          - id: minimum-arm64
            os: macos-14
            arch: arm64
            xcode: /Applications/Xcode_16.2.app/Contents/Developer
            configuration: Debug
          - id: current-arm64
            os: macos-26
            arch: arm64
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
            configuration: Debug
          - id: release-arm64
            os: macos-26
            arch: arm64
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
            configuration: Release
          - id: preview-arm64
            os: xcode-27
            arch: arm64
            xcode: /Applications/Xcode.app/Contents/Developer
            configuration: Debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
      NATIVE_CONFIGURATION: ${{ matrix.configuration }}
      EXPECTED_ARCHITECTURE: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
      # Homebrew supplies build tools and GoogleTest only; the app's libraries
      # come from apps/macos/deps.py.
      - name: Verify runner and install build tools
        id: runner
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"
          xcodebuild -version
          echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          brew install cmake ninja pkgconf meson googletest
      - name: Record actual host, toolchain and dependencies
        run: |
          mkdir -p build/native-ci
          sw_vers > build/native-ci/host.txt
          uname -m >> build/native-ci/host.txt
          xcodebuild -version > build/native-ci/toolchain.txt
          xcrun swift --version >> build/native-ci/toolchain.txt
          cmake --version >> build/native-ci/toolchain.txt
          brew info --json=v2 cmake ninja pkgconf meson googletest > build/native-ci/dependencies.json
      - name: Cache the static dependencies
        uses: actions/cache@v6
        with:
          path: |
            build/native-deps/sources
            build/native-deps/arm64
          key: native-deps-${{ matrix.os }}-${{ steps.runner.outputs.xcode }}-${{ hashFiles('apps/macos/deps.py') }}
      - name: Build and test the static dependencies
        run: python3 apps/macos/deps.py --check
      - name: Build, verify and package
        run: |
          set -o pipefail
          python3 .github/scripts/annotate-failure.py python3 apps/macos/build.py --build-dir build/native-ci \
            --developer-dir "$DEVELOPER_DIR" --prefix "$(brew --prefix)" \
            --configuration "$NATIVE_CONFIGURATION" --parallel 2 --test --package \
            2>&1 | tee build/native-ci/build.log
      - name: Run the full native protocol baseline
        run: |
          set -o pipefail
          python3 .github/scripts/annotate-failure.py python3 tests/integration/macos-scaling-smoke.py \
            "build/native-ci/app/$NATIVE_CONFIGURATION/TidyVNC.app/Contents/MacOS/vncviewer" \
            --frontend swiftui --report-dir build/native-ci/protocol \
            2>&1 | tee build/native-ci/protocol.log
      - name: Run actual-app VNC authentication cases
        run: |
          set -o pipefail
          python3 .github/scripts/annotate-failure.py python3 tests/integration/macos-auth-smoke.py \
            "build/native-ci/app/$NATIVE_CONFIGURATION/TidyVNC.app" \
            2>&1 | tee build/native-ci/auth.log
      - name: Run actual-app security handshakes against the project's server side
        run: |
          set -o pipefail
          python3 .github/scripts/annotate-failure.py python3 tests/integration/macos-security-smoke.py \
            "build/native-ci/app/$NATIVE_CONFIGURATION/TidyVNC.app" \
            --peer build/native-ci/core/tests/macos/native-security-peer \
            2>&1 | tee build/native-ci/security.log
      - name: Run actual-app SSH tunnel through a loopback sshd
        run: |
          set -o pipefail
          python3 .github/scripts/annotate-failure.py python3 tests/integration/macos-tunnel-smoke.py \
            "build/native-ci/app/$NATIVE_CONFIGURATION/TidyVNC.app" \
            --peer build/native-ci/core/tests/macos/native-security-peer \
            2>&1 | tee build/native-ci/tunnel.log
      - name: Inspect packaged app inside the read-only disk image
        run: |
          set -o pipefail
          package="build/native-ci/package/$NATIVE_CONFIGURATION"
          python3 .github/scripts/annotate-failure.py python3 tests/macos/package-inspect.py --dmg "$package"/*.dmg \
            --source-app "build/native-ci/app/$NATIVE_CONFIGURATION/TidyVNC.app" \
            --report "$package/package-report.json" 2>&1 | tee build/native-ci/package-inspection.log
      - name: Preserve development bundle for inspection
        if: always()
        run: |
          app="build/native-ci/app/$NATIVE_CONFIGURATION/TidyVNC.app"
          if [ -d "$app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$app" build/native-ci/NativeDevelopmentApp.zip
          fi
      - name: Upload development evidence (not a distribution release)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-development-${{ matrix.id }}
          if-no-files-found: warn
          path: |
            build/native-ci/host.txt
            build/native-ci/toolchain.txt
            build/native-ci/dependencies.json
            build/native-deps/arm64/deps.json
            build/native-deps/work/*.log
            build/native-ci/build.log
            build/native-ci/NativeDevelopmentApp.zip
            build/native-ci/package-inspection.log
            build/native-ci/protocol.log
            build/native-ci/auth.log
            build/native-ci/security.log
            build/native-ci/tunnel.log
            build/native-ci/protocol/**
            build/native-ci/package/**/*.dmg
            build/native-ci/package/**/package-report.json
            build/native-ci/verification/**/summary.json
            build/native-ci/verification/**/*.xml
            build/native-ci/verification/**/*.log
            build/native-ci/core/tests/macos/**/*.png
