name: Build

on: [push, pull_request]

jobs:
  rebrand-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Audit exact branding exceptions and preserved attribution
        run: python3 tests/rebrand/audit.py
      - name: Check build option compatibility
        run: python3 tests/rebrand/build-options.py

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERBOSE: 1
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxft-dev libxinerama-dev libxcursor-dev libpng-dev gettext appstream \
            libpixman-1-dev libjpeg-turbo8-dev \
            libgnutls28-dev nettle-dev libgmp-dev \
            libxtst-dev libxdamage-dev libxfixes-dev libxrandr-dev \
            libpam-dev libsystemd-dev libpwquality-dev \
            libavcodec-dev libavutil-dev libswscale-dev \
            libpulse-dev \
            uuid-dev libglib2.0-dev libpipewire-0.3-dev \
            libwayland-dev libxkbcommon-dev \
            libgtest-dev
      - name: Cache FLTK install
        id: fltk-cache
        uses: actions/cache@v4
        with:
          path: fltk-install
          key: fltk-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-static-release-${{ hashFiles('cmake/FLTK/CMakeLists.txt') }}
      - name: Build pinned FLTK
        if: steps.fltk-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S cmake/FLTK -B fltk-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/fltk-install"
          cmake --build fltk-build --parallel 2
      - name: Configure
        run: |
          cmake \
            -DFLTK_DIR="$PWD/fltk-install/share/fltk" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_NLS=ON \
            -DENABLE_H264=ON \
            -DENABLE_AUDIO=ON \
            -DENABLE_GNUTLS=ON \
            -DENABLE_NETTLE=ON \
            -DENABLE_PAM=ON \
            -DBUILD_VIEWER=ON \
            -DENABLE_SYSTEMD=ON \
            -DENABLE_PWQUALITY=ON \
            -DENABLE_WAYLAND=ON \
            -S . -B build
      - name: Build
        working-directory: build
        run: make
      - name: Install
        working-directory: build
        run: make tarball
      - uses: actions/upload-artifact@v7
        with:
          name: Linux (Ubuntu)
          path: build/tidyvnc-*.tar.gz
      - name: Test
        working-directory: build
        run: ctest --test-dir tests/unit/ --output-on-failure --no-tests=error --output-junit test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: build/tests/unit/test-results.xml

  report-linux:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    needs: build-linux
    if: always()
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test-results-linux
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results-linux
          name: FIXME not used, but required
          path: '*.xml'
          reporter: java-junit

  build-all-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERBOSE: 1
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxft-dev libxinerama-dev libxcursor-dev libpng-dev \
            libpixman-1-dev libjpeg-turbo8-dev \
            libxtst-dev libxdamage-dev libxfixes-dev libxrandr-dev \
            uuid-dev libglib2.0-dev libpipewire-0.3-dev \
            libwayland-dev libxkbcommon-dev \
            libgtest-dev
      - name: Cache FLTK install
        id: fltk-cache
        uses: actions/cache@v4
        with:
          path: fltk-install
          key: fltk-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-static-release-${{ hashFiles('cmake/FLTK/CMakeLists.txt') }}
      - name: Build pinned FLTK
        if: steps.fltk-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S cmake/FLTK -B fltk-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/fltk-install"
          cmake --build fltk-build --parallel 2
      - name: Configure
        run: |
          cmake \
            -DFLTK_DIR="$PWD/fltk-install/share/fltk" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_NLS=OFF \
            -DENABLE_H264=OFF \
            -DENABLE_AUDIO=OFF \
            -DBUILD_VIEWER=ON \
            -DENABLE_GNUTLS=OFF \
            -DENABLE_NETTLE=OFF \
            -DENABLE_PAM=OFF \
            -DENABLE_SELINUX=OFF \
            -DENABLE_SYSTEMD=OFF \
            -DENABLE_PWQUALITY=OFF \
            -DENABLE_WAYLAND=ON \
            -S . -B build
      - name: Build
        working-directory: build
        run: make
      - name: Install
        working-directory: build
        run: make tarball
      - uses: actions/upload-artifact@v7
        with:
          name: Linux (Ubuntu, everything disabled)
          path: build/tidyvnc-*.tar.gz
      - name: Test
        working-directory: build
        run: ctest --test-dir tests/unit/ --output-on-failure --no-tests=error --output-junit test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-all-disabled
          path: build/tests/unit/test-results.xml

  report-all-disabled:
    name: Unit tests (Linux, everything disabled)
    runs-on: ubuntu-latest
    needs: build-all-disabled
    if: always()
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test-results-all-disabled
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results-all-disabled
          name: FIXME not used, but required
          path: '*.xml'
          reporter: java-junit

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERBOSE: 1
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          update: true
      - name: Install dependencies
        run: |
          pacman --sync --noconfirm --needed \
            make mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake
          pacman --sync --noconfirm --needed \
            mingw-w64-x86_64-libjpeg-turbo \
            mingw-w64-x86_64-gnutls mingw-w64-x86_64-pixman \
            mingw-w64-x86_64-nettle mingw-w64-x86_64-gmp \
            mingw-w64-x86_64-gtest
      - name: Cache FLTK install
        id: fltk-cache
        uses: actions/cache@v4
        with:
          path: fltk-install
          key: fltk-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-static-release-${{ hashFiles('cmake/FLTK/CMakeLists.txt') }}
      - name: Build pinned FLTK
        if: steps.fltk-cache.outputs.cache-hit != 'true'
        run: |
          cmake -G "MSYS Makefiles" -S cmake/FLTK -B fltk-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/fltk-install"
          cmake --build fltk-build --parallel 2
      - name: Configure
        run: |
          cmake \
            -DFLTK_DIR="$PWD/fltk-install/share/fltk" \
            -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_NLS=ON \
            -DENABLE_H264=ON \
            -DENABLE_AUDIO=ON \
            -DENABLE_GNUTLS=ON \
            -DENABLE_NETTLE=ON \
            -DBUILD_VIEWER=ON \
            -S . -B build
      - name: Build
        working-directory: build
        run: make
      - name: Install
        working-directory: build
        env:
          MSYS2_PATH_TYPE: inherit
        run: make installer winvnc_installer
      - uses: actions/upload-artifact@v7
        with:
          name: Windows
          path: build/release/tidyvnc*.exe
      - name: Test
        working-directory: build
        run: ctest --test-dir tests/unit/ --output-on-failure --no-tests=error --output-junit test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: build/tests/unit/test-results.xml

  report-windows:
    name: Unit tests (Windows)
    runs-on: ubuntu-latest
    needs: build-windows
    if: always()
    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results-windows
          name: FIXME not used, but required
          path: '*.xml'
          reporter: java-junit

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      VERBOSE: 1
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          brew install \
            pixman ffmpeg \
            gnutls nettle gmp \
            googletest
      - name: Cache FLTK install
        id: fltk-cache
        uses: actions/cache@v4
        with:
          path: fltk-install
          key: fltk-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-static-release-${{ hashFiles('cmake/FLTK/CMakeLists.txt') }}
      - name: Build pinned FLTK
        if: steps.fltk-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S cmake/FLTK -B fltk-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/fltk-install"
          cmake --build fltk-build --parallel 2
      - name: Configure
        run: |
          cmake \
            -DFLTK_DIR="$PWD/fltk-install/share/fltk" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_NLS=ON \
            -DENABLE_H264=ON \
            -DENABLE_GNUTLS=ON \
            -DENABLE_NETTLE=ON \
            -DBUILD_VIEWER=ON \
            -S . -B build
      - name: Build
        working-directory: build
        run: make
      - name: Install
        working-directory: build
        run: make dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macOS
          path: build/release/TidyVNC-*.dmg
      - name: Test
        working-directory: build
        run: ctest --test-dir tests/unit/ --output-on-failure --no-tests=error --output-junit test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: build/tests/unit/test-results.xml

  report-macos:
    name: Unit tests (macOS)
    runs-on: ubuntu-latest
    needs: build-macos
    if: always()
    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results-macos
          name: FIXME not used, but required
          path: '*.xml'
          reporter: java-junit

  build-packages:
    timeout-minutes: 20
    strategy:
      matrix:
        target:
          - rocky8
          - rocky9
          - rocky10
          - jammy
          - noble
          - resolute
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      DOCKER: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t tigervnc/$DOCKER .github/containers/$DOCKER
      - name: Build packages
        run: .github/containers/$DOCKER/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Packages (${{ matrix.target }})
          path: .github/containers/${{ matrix.target }}/result
